events {
    worker_connections 1024;
}

http {
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    
    # Logging
    access_log logs/access.log;
    error_log logs/error.log;

    # Upstream definitions with load balancing
    # User Service: Multiple instances for load balancing
    upstream user_service {
        least_conn;  # Load balancing method: least connections
        server localhost:8001;
        server localhost:8003;  # Second instance (optional, start separately)
    }

    # Order Service: Single instance
    upstream order_service {
        server localhost:8002;
    }

    server {
        listen 8080;
        server_name localhost;

        # Rate limiting applied to all API routes
        limit_req zone=api_limit burst=20 nodelay;

        # User Service routes
        location ~ ^/api/users(/.*)?$ {
            rewrite ^/api/users(/.*)?$ /users$1 break;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Order Service routes
        location ~ ^/api/orders(/.*)?$ {
            rewrite ^/api/orders(/.*)?$ /orders$1 break;
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Default response
        location / {
            return 404 '{"error": "Not Found", "message": "Use /api/users or /api/orders"}';
            default_type application/json;
        }
    }
}
